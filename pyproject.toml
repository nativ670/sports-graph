[project]
name = "sportsgraph"
version = "0.1.0"
description = "Real-time soccer player tracking, live player networks and tactical metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need internet access"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
